name: Broken Links Report

on:
  schedule:
    - cron: "0 2 * * 6"
  workflow_dispatch:

concurrency:
  group: broken-links-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -o awesome-docker ./cmd/awesome-docker

      - name: Run Link Check
        id: link_check
        run: ./awesome-docker ci broken-links --issue-file broken_links_issue.md --github-output "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summarize broken-link findings
        if: always()
        shell: bash
        run: |
          {
            echo "## Broken Links Report"
            echo "Workflow: read-only. This job does not open, edit, or close GitHub issues."
            if [ -s broken_links_issue.md ]; then
              cat broken_links_issue.md
            else
              echo "No broken-link report was generated. Review the job logs for details."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
