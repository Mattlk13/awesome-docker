name: Weekly Health Report

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

concurrency:
  group: health-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -o awesome-docker ./cmd/awesome-docker

      - name: Run Health + Report
        id: report
        run: ./awesome-docker ci health-report --issue-file health_report.txt --github-output "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summarize repository health
        if: always()
        shell: bash
        run: |
          {
            echo "## Weekly Health Report"
            echo "Workflow: read-only. This job does not open, edit, or close GitHub issues."
            if [ -s health_report.txt ]; then
              cat health_report.txt
            else
              echo "No health report was generated. Review the job logs for details."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
